<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="AI Lead Qualification and Routing: Microsoft Forms to SharePoint to Power Automate to Claude API to Teams">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E1446"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="48" y1="0" x2="858" y2="0">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    .node{animation:pulse 3s ease-in-out infinite}
    .d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}
    @keyframes pulse{0%,100%{stroke-opacity:.45}50%{stroke-opacity:1}}
  </style>

  <rect width="900" height="300" rx="16" fill="url(#bg)"/>
  <rect width="900" height="300" rx="16" fill="url(#grid)"/>

  <text x="48" y="54" class="mono" font-size="15" fill="#67E8F9">~/3509 $ ./lead-routing --run<tspan class="cursor"> ▍</tspan></text>
  <text x="46" y="104" class="sans" font-size="38" font-weight="800" fill="url(#accent)">AI Lead Qualification &amp; Routing</text>
  <text x="48" y="136" class="sans" font-size="17" font-weight="500" fill="#E5E7EB">Every new lead scored, matched to an offer, and routed before I open Teams.</text>

  <g fill="none" stroke="url(#line)" stroke-width="2">
    <path class="flow" d="M178 222 H232"/>
    <path class="flow" d="M352 222 H400"/>
    <path class="flow" d="M532 222 H580"/>
    <path class="flow" d="M700 222 H754"/>
  </g>

  <g stroke-width="2" fill="#0B1020">
    <rect class="node"    x="48"  y="190" width="130" height="64" rx="12" stroke="#67E8F9"/>
    <rect class="node d1" x="232" y="190" width="120" height="64" rx="12" stroke="#86C5FA"/>
    <rect class="node d2" x="400" y="190" width="132" height="64" rx="12" stroke="#A78BFA"/>
    <rect class="node d3" x="580" y="190" width="120" height="64" rx="12" stroke="#CF7FD8"/>
    <rect class="node d4" x="754" y="190" width="104" height="64" rx="12" stroke="#F472B6"/>
  </g>

  <g class="sans" text-anchor="middle">
    <text x="113" y="218" font-size="14" font-weight="700" fill="#E5E7EB">Forms</text>
    <text x="113" y="238" font-size="11" fill="#9CA3AF" class="mono">intake</text>
    <text x="292" y="218" font-size="14" font-weight="700" fill="#E5E7EB">SharePoint</text>
    <text x="292" y="238" font-size="11" fill="#9CA3AF" class="mono">record</text>
    <text x="466" y="218" font-size="14" font-weight="700" fill="#E5E7EB">Power Automate</text>
    <text x="466" y="238" font-size="11" fill="#9CA3AF" class="mono">orchestrate</text>
    <text x="640" y="218" font-size="14" font-weight="700" fill="#E5E7EB">Claude API</text>
    <text x="640" y="238" font-size="11" fill="#9CA3AF" class="mono">score + route</text>
    <text x="806" y="218" font-size="14" font-weight="700" fill="#E5E7EB">Teams</text>
    <text x="806" y="238" font-size="11" fill="#9CA3AF" class="mono">human decides</text>
  </g>
</svg>
